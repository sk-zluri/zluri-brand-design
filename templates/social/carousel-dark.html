<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zluri · Carousel — dark statement system</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../zluri.css">
<style>
  /* guidelines/04 §D1 — 1200×1200, black field with an inset #111 card */
  .car { --bg: #000; }
  .car .card { position: absolute; inset: calc(var(--zluri-u) * 2.5); background: var(--zluri-carousel-inset); z-index: 1; }
  .car .orbits { position: absolute; right: -6%; bottom: -4%; width: 62%; opacity: .34; z-index: 1; }
  .car .head { position: absolute; left: calc(var(--zluri-u) * 5.8); top: calc(var(--zluri-u) * 12.9); width: 72%; }
  .car .head .t-lede { margin-top: calc(var(--zluri-u) * 4.4); max-width: 86%; }
  .car .foot { position: absolute; left: calc(var(--zluri-u) * 5.8); right: calc(var(--zluri-u) * 5.8); bottom: calc(var(--zluri-u) * 6.4); }
  .car .label { display: inline-block; font: 400 calc(var(--zluri-u) * 5.2)/1.2 var(--font-display); }
  .car .sub { font: 400 calc(var(--zluri-u) * 5.2)/1.2 var(--font-display); margin: calc(var(--zluri-u) * 2.6) 0 calc(var(--zluri-u) * 6.2); }
  .car .body { position: absolute; left: calc(var(--zluri-u) * 7.9); top: calc(var(--zluri-u) * 12.4); right: calc(var(--zluri-u) * 9); }
</style>
</head>
<body>
<div class="sheet">

  <figure>
    <div class="artboard c-pure car" style="--w:1200px; --h:1200px">
      <div class="card"></div>
      <img class="orbits" src="../../assets/motifs/orbit-ellipses.svg" alt="">
      <img class="logo abs" style="right:calc(var(--zluri-u)*5.3); top:calc(var(--zluri-u)*6)" src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri">
      <div class="head">
        <h1 class="h-cover">The <span class="key">Access Visibility</span> Gap</h1>
        <p class="t-lede">Without complete visibility, every downstream activity operates on incomplete information</p>
      </div>
      <div class="foot"><span class="pillbar"><span class="capsule">→</span>Swipe to learn more</span></div>
    </div>
    <figcaption>Cover — Satoshi Regular 122 / −6%, Mint phrase, orbit lines, pill bar with pink capsule</figcaption>
  </figure>

  <figure>
    <div class="artboard c-pure car" style="--w:1200px; --h:1200px">
      <div class="card"></div>
      <img class="logo abs" style="right:calc(var(--zluri-u)*5.3); top:calc(var(--zluri-u)*6)" src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri">
      <div class="body">
        <span class="label mark">Can’t Automate</span>
        <p class="sub">What you can’t see</p>
        <ul class="bullets">
          <li>Provisioning workflows skip unknown apps</li>
          <li>Deprovisioning can’t revoke shadow IT</li>
          <li>Lifecycle automation stops at the visibility boundary</li>
        </ul>
      </div>
      <div class="foot"><span class="pillbar full"><span></span><span class="capsule">→</span></span></div>
    </div>
    <figcaption>Content — highlight-block label, Satoshi sub-title, three Mint-square bullets (Inter Light 41.7)</figcaption>
  </figure>

  <figure>
    <div class="artboard c-pure car" style="--w:1200px; --h:1200px">
      <div class="card"></div>
      <img class="logo abs" style="right:calc(var(--zluri-u)*5.3); top:calc(var(--zluri-u)*6)" src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri">
      <div class="head" style="top:calc(var(--zluri-u)*11)"><h1 class="h-cover"><span class="key">Read the Blog</span><br>Today for More Details</h1></div>
      <div class="foot"><span class="pillbar full">Link in the post above<span class="capsule">↑</span></span></div>
    </div>
    <figcaption>CTA slide — same anchors, arrow turns ↑ for “link in the post above”</figcaption>
  </figure>

</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zluri · Carousel variants — panels, security news, light feature tour</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../zluri.css">
<style>
  /* ── D2 · Problem → solution panels (1080×1080) — guidelines/04 §D2 ── */
  .pn .num  { position: absolute; left: calc(var(--zluri-u) * 5.9); bottom: calc(var(--zluri-u) * 5.2); font: 400 calc(var(--zluri-u) * 2.78)/1 var(--font-body); }
  .pn .logo { position: absolute; right: calc(var(--zluri-u) * 5.6); bottom: calc(var(--zluri-u) * 5); width: calc(var(--zluri-u) * 11.2); }
  .pn .top  { position: absolute; left: calc(var(--zluri-u) * 5.9); right: calc(var(--zluri-u) * 5.9); top: calc(var(--zluri-u) * 8.3); }
  .pn h1    { font: 400 calc(var(--zluri-u) * 5.56)/1.2 var(--font-display); margin: 0 0 calc(var(--zluri-u) * 3.4); }
  .pn .panel { margin-top: calc(var(--zluri-u) * 4.4); background: #1b1915; border-left: calc(var(--zluri-u) * .56) solid var(--bar); padding: calc(var(--zluri-u) * 3.6) calc(var(--zluri-u) * 4.8) calc(var(--zluri-u) * 4.2); }
  .pn .panel h2 { font: 400 calc(var(--zluri-u) * 3.15)/1.2 var(--font-display); margin: 0 0 calc(var(--zluri-u) * 2.6); color: #fbf9f6; }
  .pn .panel li { list-style: none; display: grid; grid-template-columns: calc(var(--zluri-u) * 2.2) 1fr; gap: calc(var(--zluri-u) * 1.6); font: 300 calc(var(--zluri-u) * 2.41)/1.2 var(--font-body); color: #e2ded7; margin-bottom: calc(var(--zluri-u) * 1.5); }
  .pn .panel ul { margin: 0; padding: 0; }
  .pn .panel li::before { content: var(--glyph); display: grid; place-items: center; width: calc(var(--zluri-u) * 2.1); height: calc(var(--zluri-u) * 2.1); margin-top: .12em; border: 1.5px solid var(--bar); border-radius: calc(var(--zluri-u) * .3); color: var(--bar); font: 600 calc(var(--zluri-u) * 1.5)/1 var(--font-body); }
  .pn .cover { position: absolute; left: calc(var(--zluri-u) * 5.9); right: calc(var(--zluri-u) * 10); top: 38%; }
  .pn .cover h1 { font-size: calc(var(--zluri-u) * 7.4); line-height: 1.16; letter-spacing: -0.02em; }
  .pn .url { position: absolute; left: calc(var(--zluri-u) * 5.9); top: calc(var(--zluri-u) * 6.4); font: 400 calc(var(--zluri-u) * 2.6)/1 var(--font-body); }

  /* ── D4 · Security news / explainer (784×784) — guidelines/04 §D4 ── */
  .sn .hdr { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--zluri-u) * 13.6); border-bottom: 1.2px solid #535353; display: flex; justify-content: space-between; align-items: center; padding: 0 calc(var(--zluri-u) * 4.7); font: 400 calc(var(--zluri-u) * 2.9)/1 var(--font-body); color: #ddd; }
  .sn .hdr img { width: calc(var(--zluri-u) * 10.2); }
  .sn .mid { position: absolute; left: 8.5%; right: 8.5%; top: 34.8%; text-align: center; }
  .sn h1 { font: 400 calc(var(--zluri-u) * 7.54)/1.35 var(--font-display); letter-spacing: -0.06em; margin: 0; }
  .sn .mid p { font: 300 calc(var(--zluri-u) * 2.92)/1.22 var(--font-body); color: #b2b2b2; margin: calc(var(--zluri-u) * 2.6) auto 0; max-width: 88%; }
  .sn .swipe { position: absolute; right: calc(var(--zluri-u) * 5.5); bottom: calc(var(--zluri-u) * 4.6); font: 400 calc(var(--zluri-u) * 2.9)/1 var(--font-body); color: #ddd; }
  .sn .list { position: absolute; left: calc(var(--zluri-u) * 8.4); right: calc(var(--zluri-u) * 6); top: 23%; }
  .sn .list h1 { font-size: calc(var(--zluri-u) * 6.2); line-height: 1.3; text-align: left; margin-bottom: calc(var(--zluri-u) * 4.4); }
  .sn .item { display: grid; grid-template-columns: calc(var(--zluri-u) * 6.1) 1fr; gap: calc(var(--zluri-u) * 3); align-items: center; margin-bottom: calc(var(--zluri-u) * 4); font: 400 calc(var(--zluri-u) * 2.9)/1.25 var(--font-body); color: #fbf9f6; }
  .sn .item i { display: grid; place-items: center; aspect-ratio: 1; border-radius: calc(var(--zluri-u) * .5); background: var(--zluri-mint-green); }
  .sn .item svg { width: 52%; stroke: #161411; fill: none; stroke-width: 1.7; }

  /* ── D5 · Feature tour, light (784×784) — guidelines/04 §D5 ── */
  .ft h1 { position: absolute; left: calc(var(--zluri-u) * 5.1); top: calc(var(--zluri-u) * 6.2); font: 500 calc(var(--zluri-u) * 5.36)/1.35 var(--font-display); margin: 0; }
  .ft .sub { position: absolute; left: calc(var(--zluri-u) * 5.1); top: calc(var(--zluri-u) * 14.5); width: 57%; font: 400 calc(var(--zluri-u) * 2.55)/1.2 var(--font-body); color: #797979; }
  .ft .media { position: absolute; left: 5.7%; top: 24.9%; width: 88%; height: 61.7%; border-radius: calc(var(--zluri-u) * 1); background: var(--zluri-grad-deep-dive); display: grid; place-items: center; }
  .ft .chart { width: 78%; background: #fff; border-radius: calc(var(--zluri-u) * .64); padding: calc(var(--zluri-u) * 2.2); box-shadow: 0 calc(var(--zluri-u) * .5) calc(var(--zluri-u) * 1) rgba(0,0,0,.12); }
  .ft .tabs { display: flex; gap: calc(var(--zluri-u) * 2.4); font: 400 calc(var(--zluri-u) * 1.2)/1 var(--font-body); color: #222; padding-bottom: calc(var(--zluri-u) * 1.4); border-bottom: 1px solid #e8f0fc; }
  .ft .tabs b { color: #2266e2; font-weight: 600; background: #e8f0fc; padding: .5em .9em; border-radius: .4em; margin: -.5em 0; }
  .ft .bars { display: flex; align-items: flex-end; gap: 4.2%; height: calc(var(--zluri-u) * 21); padding: calc(var(--zluri-u) * 2) calc(var(--zluri-u) * 1.4) 0; border-bottom: 1px solid #ddd; }
  .ft .bars i { flex: 1; background: #73a6fa; border-radius: 2px 2px 0 0; height: var(--v); }
  .ft .num { position: absolute; left: calc(var(--zluri-u) * 5.1); bottom: calc(var(--zluri-u) * 5.4); font: 400 calc(var(--zluri-u) * 3)/1 var(--font-display); color: #000; }
  .ft .logo { position: absolute; right: calc(var(--zluri-u) * 4.6); bottom: calc(var(--zluri-u) * 4.6); width: calc(var(--zluri-u) * 11.6); }
</style>
</head>
<body>
<div class="sheet">

  <figure>
    <div class="artboard c-black pn" style="--w:1080px; --h:1080px">
      <span class="url">www.zluri.com</span>
      <div class="cover">
        <h1>Every stakeholder faces unique issues in <span class="key">access reviews</span></h1>
        <p class="t-lede" style="font-size:calc(var(--zluri-u)*3.3); margin:calc(var(--zluri-u)*2.4) 0 calc(var(--zluri-u)*4.2)">Here’s how Group-Based Access Reviews help them:</p>
        <span class="btn-white" style="font-size:calc(var(--zluri-u)*2.6)">Swipe left to learn more <span class="sq">→</span></span>
      </div>
      <img class="logo" src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri">
    </div>
    <figcaption>D2 cover — URL top-left, vertically centred headline with Mint phrase, white button with green arrow square, logo bottom-right</figcaption>
  </figure>

  <figure>
    <div class="artboard c-black pn" style="--w:1080px; --h:1080px">
      <div class="top">
        <h1>IT &amp; IAM <span class="key">Admins</span></h1>
        <hr class="hair" style="background:#e2ded7; opacity:.6">
        <div class="panel" style="--bar:#d52a00; --glyph:'×'">
          <h2>Challenges:</h2>
          <ul><li>Most user access hidden in groups</li><li>Lengthy, repetitive setup for every certification</li><li>Low completion rates from a lack of automation and accountability</li></ul>
        </div>
        <div class="panel" style="--bar:#1b9464; --glyph:'✓'; margin-top:calc(var(--zluri-u)*2.6)">
          <h2>How Zluri’s Group-Based Access Reviews Help:</h2>
          <ul><li>Unified platform for app and group certifications</li><li>Cloning, drafting, and bulk action support</li><li>Closed-loop remediation with fallback reviewer support</li></ul>
        </div>
      </div>
      <span class="num">01</span>
      <img class="logo" src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri">
    </div>
    <figcaption>D2 content — persona title + hairline; red “Challenges” panel and green “How Zluri helps” panel, each with a 6px left bar</figcaption>
  </figure>

  <figure>
    <div class="artboard c-black sn" style="--w:784px; --h:784px">
      <div class="hdr"><span>www.zluri.com</span><img src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri"></div>
      <div class="mid">
        <h1><span style="color:#40e395">Identity-Based CRM Attacks</span><br>are Growing Rapidly</h1>
        <p>[One or two lines naming the concrete threat or trend — sourced, not invented.]</p>
      </div>
      <span class="swipe">Swipe →</span>
    </div>
    <figcaption>D4 cover — header row with hairline, centred Satoshi Regular 59 / −6% (Mint line + cream line), “Swipe →”</figcaption>
  </figure>

  <figure>
    <div class="artboard c-black sn" style="--w:784px; --h:784px">
      <div class="hdr"><span>03</span><img src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri"></div>
      <div class="list">
        <h1>Why These <span class="key">Breaches</span> Happen</h1>
        <div class="item"><i><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/></svg></i>Lack of visibility into risky/admin-level OAuth scopes</div>
        <div class="item"><i><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.3 7.8-8 9-4.7-1.200-8-4.500-8-9V6z"/><path d="M12 9v4M12 16v.01"/></svg></i>Social engineering bypasses security controls</div>
        <div class="item"><i><svg viewBox="0 0 24 24"><circle cx="9" cy="14" r="4"/><path d="M12 11l7-7M16 7l2 2"/></svg></i>OAuth tokens persist unless manually revoked</div>
      </div>
    </div>
    <figcaption>D4 content — slide number in the header, title with Mint keyword, Mint icon tiles with one-line statements</figcaption>
  </figure>

  <figure>
    <div class="artboard c-white ft" style="--w:784px; --h:784px">
      <h1><span style="color:#2266e2">Active</span> Users</h1>
      <p class="sub">Track who is actively using applications in real time.</p>
      <div class="media">
        <div class="chart">
          <div class="tabs"><b>Active Users</b><span>Assigned Licenses</span><span>Optimizable Users</span></div>
          <div class="bars"><i style="--v:92%"></i><i style="--v:80%"></i><i style="--v:66%"></i><i style="--v:58%"></i><i style="--v:50%"></i><i style="--v:24%"></i><i style="--v:20%"></i><i style="--v:17%"></i><i style="--v:17%"></i><i style="--v:40%"></i></div>
        </div>
      </div>
      <span class="num">01</span>
      <img class="logo" src="../../assets/logos/default/zluri-logo-on-light.svg" alt="Zluri">
    </div>
    <figcaption>D5 light feature tour — white canvas, blue keyword, product chart card on a Deep Dive gradient panel, number bottom-left, dark logo bottom-right</figcaption>
  </figure>

</div>
</body>
</html>

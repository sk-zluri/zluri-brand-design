<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zluri · Deck slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../zluri.css">
<style>
  /* guidelines/06 — 1920×1080 */
  .dk h1 { font: 500 calc(var(--zluri-u) * 2.6)/1.2 var(--font-display); margin: 0; }
  .dk .foot { position: absolute; left: calc(var(--zluri-u) * 3.4); right: calc(var(--zluri-u) * 3.4); bottom: calc(var(--zluri-u) * 2.2); display: flex; justify-content: space-between; align-items: center; font: 400 calc(var(--zluri-u) * .73)/1 var(--font-body); color: var(--meta); }
  /* cover */
  .cover h1 { position: absolute; left: calc(var(--zluri-u) * 3.4); bottom: calc(var(--zluri-u) * 7); font: 300 calc(var(--zluri-u) * 7.6)/1.05 var(--font-display); letter-spacing: -0.04em; }
  /* section break */
  .brk .n { position: absolute; left: calc(var(--zluri-u) * 3.4); top: 38%; font: 500 calc(var(--zluri-u) * 1.5)/1 var(--font-display); color: var(--zluri-mint-green); }
  .brk h1 { position: absolute; left: calc(var(--zluri-u) * 3.4); top: 43%; font: 400 calc(var(--zluri-u) * 5.2)/1.1 var(--font-display); letter-spacing: -0.04em; }
  /* editorial */
  .ed .col { position: absolute; left: calc(var(--zluri-u) * 3.4); top: calc(var(--zluri-u) * 3.4); width: 27%; }
  .ed .col p { font: 300 calc(var(--zluri-u) * 1.2)/1.42 var(--font-body); color: #474640; margin: calc(var(--zluri-u) * 1.5) 0 0; }
  .ed .panel { position: absolute; left: 36%; right: calc(var(--zluri-u) * 3.4); top: calc(var(--zluri-u) * 3.4); bottom: calc(var(--zluri-u) * 5.4); background: #fbf9f6; border: 1px solid #e2ded7; border-radius: calc(var(--zluri-u) * .7); display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--zluri-u) * 1.4); padding: calc(var(--zluri-u) * 2.6); align-content: center; }
  .ed .kpi { background: #fff; border: 1px solid #e2ded7; border-radius: calc(var(--zluri-u) * .45); padding: calc(var(--zluri-u) * 1.6); }
  .ed .kpi b { display: block; font: 500 calc(var(--zluri-u) * 3.4)/1 var(--font-display); color: #161411; }
  .ed .kpi span { display: block; margin-top: calc(var(--zluri-u) * .9); font: 400 calc(var(--zluri-u) * .95)/1.3 var(--font-body); color: #474640; }
  /* dark flow diagram */
  .fl .head { position: absolute; left: calc(var(--zluri-u) * 3.4); top: calc(var(--zluri-u) * 3.2); }
  .fl svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  .fl .node { position: absolute; z-index: 2; display: inline-flex; align-items: center; gap: .55em; height: calc(var(--zluri-u) * 2.5); padding: 0 calc(var(--zluri-u) * 1.05); border-radius: 999px; background: #1f1e1b; border: 1px solid #3a3936; font: 400 calc(var(--zluri-u) * 1.05)/1 var(--font-body); color: #fbf9f6; transform: translateY(-50%); white-space: nowrap; }
  .fl .node i { width: .8em; height: .8em; border-radius: 50%; background: var(--c, #e2ded7); display: inline-block; }
  .fl .in { right: 62%; } .fl .out { left: 64.500%; }
  .fl .hub { position: absolute; z-index: 2; left: 50%; top: 53%; width: calc(var(--zluri-u) * 9.4); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: calc(var(--zluri-u) * 1.1); background: #1f1e1b; border: 1px solid #fbf9f6;
    background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 25% 25%; display: grid; place-items: center; box-shadow: 0 0 calc(var(--zluri-u) * 3) rgba(87,225,255,.12); }
  .fl .hub img { width: 46%; }
</style>
</head>
<body>
<div class="sheet">

  <figure>
    <div class="artboard c-black dk cover" style="--w:1920px; --h:1080px">
      <img class="logo abs" style="left:calc(var(--zluri-u)*3.4); top:calc(var(--zluri-u)*3); width:calc(var(--zluri-u)*6.6)" src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri">
      <h1>[Deck title]<br>[second line] <span style="color:var(--zluri-bright-blue)">2026</span></h1>
      <div class="foot"><span>[Date]</span><span>zluri.com</span></div>
    </div>
    <figcaption>Cover — Deep Black, huge Satoshi Light title bottom-left, one Bright-Blue fragment (brand-guidelines cover style)</figcaption>
  </figure>

  <figure>
    <div class="artboard c-black dk brk" style="--w:1920px; --h:1080px">
      <span class="n">02</span>
      <h1>The identity surface<br>has expanded</h1>
      <div class="foot"><img class="logo" style="width:calc(var(--zluri-u)*4.2)" src="../../assets/logos/default/zluri-logo-on-dark.svg" alt="Zluri"><span>12</span></div>
    </div>
    <figcaption>Section break — numeral in Mint, Satoshi Regular 100 / −4%</figcaption>
  </figure>

  <figure>
    <div class="artboard c-white dk ed" style="--w:1920px; --h:1080px">
      <div class="col">
        <h1>[Takeaway as the slide title]</h1>
        <p>[Two to four short lines of supporting text in Inter Light, max ~38 characters per line. State the point; let the panel prove it.]</p>
      </div>
      <div class="panel">
        <div class="kpi"><b>[00%]</b><span>[what improved]</span></div>
        <div class="kpi"><b>[000+]</b><span>[what was saved]</span></div>
        <div class="kpi"><b>[0x]</b><span>[what got faster]</span></div>
      </div>
      <div class="foot"><img class="logo" style="width:calc(var(--zluri-u)*4.2)" src="../../assets/logos/default/zluri-logo-on-light.svg" alt="Zluri"><span>13</span></div>
    </div>
    <figcaption>Editorial content slide — text column left third, cream content panel (radius 12, linen hairline) right two-thirds</figcaption>
  </figure>

  <figure>
    <div class="artboard c-black dk fl" style="--w:1920px; --h:1080px">
      <div class="head"><p class="eyebrow">How it works</p><h1 style="margin-top:calc(var(--zluri-u)*.8)">Every source in. Every outcome out.</h1></div>
      <svg class="wires" viewBox="0 0 1920 1080" fill="none" stroke-width="1.5">
        <g stroke="rgba(251,249,246,.6)">
          <path d="M730 330 C 840 330, 820 520, 870 520"/><path d="M730 440 C 820 440, 820 545, 870 545"/><path d="M730 572 L 870 572"/>
          <path d="M730 704 C 820 704, 820 600, 870 600"/><path d="M730 814 C 840 814, 820 625, 870 625"/>
        </g>
        <path stroke="#4ad89a" d="M1050 520 C 1110 520, 1100 330, 1238 330"/>
        <path stroke="#e89604" d="M1050 545 C 1110 545, 1120 440, 1238 440"/>
        <path stroke="#d52a00" d="M1050 572 L 1238 572"/>
        <path stroke="#7763c7" d="M1050 600 C 1110 600, 1120 704, 1238 704"/>
        <path stroke="#366ecf" d="M1050 625 C 1110 625, 1100 814, 1238 814"/>
      </svg>
      <span class="node in" style="top:330px"><i style="--c:#aadb12"></i>HRMS &nbsp;·&nbsp; IdPs</span>
      <span class="node in" style="top:440px"><i style="--c:#57e1ff"></i>Finance Apps</span>
      <span class="node in" style="top:572px"><i style="--c:#e84393"></i>SaaS Apps</span>
      <span class="node in" style="top:704px"><i style="--c:#e89604"></i>MDMs &nbsp;·&nbsp; CASBs</span>
      <span class="node in" style="top:814px"><i style="--c:#d3ff57"></i>SDK &nbsp;·&nbsp; CSVs</span>
      <div class="hub"><img src="../../assets/logos/mark/zluri-eye-mark.svg" alt="Zluri"></div>
      <span class="node out" style="top:330px"><i style="--c:#4ad89a"></i>User lifecycle management</span>
      <span class="node out" style="top:440px"><i style="--c:#e89604"></i>Automated Access Reviews</span>
      <span class="node out" style="top:572px"><i style="--c:#d52a00"></i>Self-service Access Requests</span>
      <span class="node out" style="top:704px"><i style="--c:#7763c7"></i>Monitor Shadow IT and AI Apps</span>
      <span class="node out" style="top:814px"><i style="--c:#366ecf"></i>IT cost management</span>
    </div>
    <figcaption>Dark flow diagram — source pills → hub tile with the eye mark → colour-coded outcome pills (website animation storyboard)</figcaption>
  </figure>

</div>
</body>
</html>
